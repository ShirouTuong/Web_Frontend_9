<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <title>grid-gap: Ví dụ 2</title>
  <style>
    .grid-container {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      grid-gap: 30px 10px;
    }

    .grid-container div {
      background-color: lightgreen;
      padding: 20px;
      text-align: center;
    }
  </style>
</head>
<body>

  <div class="grid-container">
    <div>Ô 1</div>
    <div>Ô 2</div>
    <div>Ô 3</div>
    <div>Ô 4</div>
    <div>Ô 5</div>
    <div>Ô 6</div>
  </div>

</body>
</html>
