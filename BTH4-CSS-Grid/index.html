<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bố cục Responsive bằng CSS Grid</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="container">
        <header class="header">Header - Tiêu đề trang</header>
        <nav class="nav">Navigation - Menu điều hướng</nav>
        <main class="content">Main Content - Khu vực hiển thị nội dung chính</main>
        <aside class="sidebar">Sidebar - Nội dung phụ (tin tức, quảng cáo)</aside>
        <footer class="footer">Footer - Thông tin cuối trang</footer>
    </div>

</body>
</html>
